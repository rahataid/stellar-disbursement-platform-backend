name: CICD

on:
  push:
    branches:
      - rahat-dev
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_REPO: esatya/stellar-sdp-v2


jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Docker Hub repo
        run: |
          if [[ -z "${{ env.DOCKERHUB_REPO }}" ]]; then
            echo "DOCKERHUB_REPO must be configured as a repository secret."
            exit 1
          fi

      - name: Import Secrets from Vault
        id: vault
        uses: hashicorp/vault-action@v2.4.0
        with:
          url: ${{ secrets.VAULT_URL }}
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            github/data/general/docker/esatya username | DOCKERHUB_USERNAME ;
            github/data/general/docker/esatya password | DOCKERHUB_TOKEN ;

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push development image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.development
          push: true
          tags: ${{ env.DOCKERHUB_REPO }}:dev
          build-args: |
            GIT_COMMIT=${{ github.sha }}

      - name: Build and push production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.DOCKERHUB_REPO }}:latest
          build-args: |
            GIT_COMMIT=${{ github.sha }}
